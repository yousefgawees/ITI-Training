<!DOCTYPE html>
<html>
<head>
    <title>Question 2</title>
</head>

<body>

<script>

    function celsiusToFahrenheit(c) {
        let f = (c * 9 / 5) + 32;
        return f;
    }

    let celsius = Number(prompt("Enter temperature in Celsius"));

    let fahrenheit = celsiusToFahrenheit(celsius);

    document.write("Temperature in Fahrenheit = " + fahrenheit);

</script>

</body>
</html>
