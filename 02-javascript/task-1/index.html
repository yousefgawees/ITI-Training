<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Task 1</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .question {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        .output {
            margin-top: 15px;
            padding: 10px;
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>JavaScript Task 1</h1>


    <!-- ================= QUESTION 1 ================= -->

    <div class="question">

        <h2>Question 1</h2>

        <p>Alert and Prompt</p>

        <button onclick="welcomeUser()">Start</button>

        <div class="output" id="q1Output"></div>

    </div>


    <!-- ================= QUESTION 2 ================= -->

    <div class="question">

        <h2>Question 2</h2>

        <p>Convert Celsius to Fahrenheit</p>

        <input type="number" id="celsius" placeholder="Enter Celsius">

        <button onclick="convertTemperature()">
            Convert
        </button>

        <div class="output" id="q2Output"></div>

    </div>


    <!-- ================= QUESTION 3 ================= -->

    <div class="question">

        <h2>Question 3</h2>

        <p>Find the Greatest Number</p>

        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <input type="number" id="num3" placeholder="Third number">

        <br><br>

        <button onclick="findGreatest()">
            Find Greatest
        </button>

        <div class="output" id="q3Output"></div>

    </div>


    <!-- ================= QUESTION 4 ================= -->

    <div class="question">

        <h2>Question 4</h2>

        <p>Multiplication Table of 5</p>

        <button onclick="multiplicationTable()">
            Show Table
        </button>

        <div class="output" id="q4Output"></div>

    </div>


    <!-- ================= QUESTION 5 ================= -->

    <div class="question">

        <h2>Question 5</h2>

        <p>JSON Object</p>

        <pre id="q5Output"></pre>

    </div>


    <script>


        // ================= QUESTION 1 =================

        function welcomeUser() {

            alert("Welcome to my site");

            let name = prompt("Please enter your name");

            document.getElementById("q1Output").innerHTML =
                "Welcome " + name;

        }


        // ================= QUESTION 2 =================

        function celsiusToFahrenheit(c) {

            return (c * 9 / 5) + 32;

        }


        function convertTemperature() {

            let celsius =
                Number(document.getElementById("celsius").value);

            let fahrenheit =
                celsiusToFahrenheit(celsius);

            document.getElementById("q2Output").innerHTML =
                celsius + "°C = " + fahrenheit + "°F";

        }


        // ================= QUESTION 3 =================

        function greatest(a, b, c) {

            if (a >= b && a >= c) {
                return a;
            }
            else if (b >= a && b >= c) {
                return b;
            }
            else {
                return c;
            }

        }


        function findGreatest() {

            let a =
                Number(document.getElementById("num1").value);

            let b =
                Number(document.getElementById("num2").value);

            let c =
                Number(document.getElementById("num3").value);

            let result = greatest(a, b, c);

            document.getElementById("q3Output").innerHTML =
                "The greatest number is: " + result;

        }


        // ================= QUESTION 4 =================

        function multiplicationTable() {

            let result = "";

            for (let i = 1; i <= 10; i++) {

                result +=
                    "5 x " + i + " = " + (5 * i) + "<br>";

            }

            document.getElementById("q4Output").innerHTML =
                result;

        }


        // ================= QUESTION 5 =================

        let student = {

            name: "Yusef Mohamed",
            address: "Alexandria, Egypt",
            phone: "01000000000",
            age: 22,
            track: "Software Engineering"

        };


        document.getElementById("q5Output").textContent =
            JSON.stringify(student, null, 4);


    </script>

</body>
</html>
