<body>

    <h1>Remove Character from Array</h1>

    <script>

        function removeCharacter(arr, character) {

            let newArray = [];

            for (let i = 0; i < arr.length; i++) {

                if (arr[i] !== character) {
                    newArray.push(arr[i]);
                }

            }

            return newArray;
        }

        let letters = ["a", "b", "c", "a", "d", "a"];

        let result = removeCharacter(letters, "a");

        document.write("Original Array: " + letters + "<br><br>");

        document.write("After Removing 'a': " + result);

    </script>

</body>
</html>
