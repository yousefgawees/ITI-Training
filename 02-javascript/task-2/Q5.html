<body>

    <h1>Maximum Number in Array</h1>

    <script>

        function findMaximum(arr) {

            let max = arr[0];

            for (let i = 1; i < arr.length; i++) {

                if (arr[i] > max) {
                    max = arr[i];
                }

            }

            return max;
        }

        let numbers = [10, 25, 7, 45, 18, 30];

        let result = findMaximum(numbers);

        document.write("The maximum number is: " + result);

    </script>

</body>
</html>
