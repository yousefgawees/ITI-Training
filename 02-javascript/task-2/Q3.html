<body>

    <h1>Count Number in Array</h1>

    <script>

        function countNumber(arr, number) {

            let count = 0;

            for (let i = 0; i < arr.length; i++) {

                if (arr[i] === number) {
                    count++;
                }

            }

            return count;
        }

        let numbers = [5, 2, 5, 8, 5, 10, 3, 5];

        let result = countNumber(numbers, 5);

        document.write("The number 5 appears " + result + " times.");

    </script>

</body>
</html>
