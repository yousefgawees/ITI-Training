<!DOCTYPE html>
<html>

<head>

    <title>JavaScript Task 4</title>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        .question {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        /* Question 1 */

        .gallery {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 200px;
            height: 130px;
            object-fit: cover;
            opacity: 1;
            transition: opacity 1s;
        }

        .gallery img:hover {
            opacity: 0.3;
        }


        /* Question 2 */

        .color-box {
            display: inline-block;
            padding: 20px;
            margin: 5px;
            color: white;
            font-weight: bold;
        }

        #changeColors {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }


        /* Question 3 */

        .password-container {
            display: flex;
            width: 350px;
        }

        #password {
            padding: 10px;
            flex: 1;
        }

        #switchPassword {
            padding: 10px;
            cursor: pointer;
        }


        /* Question 4 */

        #questionText {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #questionNumber {
            font-size: 18px;
        }

        .question-buttons button {
            padding: 10px 25px;
            margin-right: 10px;
            cursor: pointer;
        }


        /* Question 5 */

        .calculator {
            width: 280px;
            padding: 15px;
            border: 2px solid black;
        }

        #display {
            width: 100%;
            height: 45px;
            font-size: 22px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .calculator button {
            width: 55px;
            height: 45px;
            margin: 3px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>

</head>


<body>


    <h1>JavaScript Task 4</h1>


    <!-- ================= QUESTION 1 ================= -->

    <div class="question">

        <h2>Question 1 - Photo Gallery</h2>

        <p>
            Move the mouse over an image to make it fade out.
        </p>

        <div class="gallery">

            <img src="https://picsum.photos/id/10/400/250" alt="Image 1">

            <img src="https://picsum.photos/id/20/400/250" alt="Image 2">

            <img src="https://picsum.photos/id/30/400/250" alt="Image 3">

            <img src="https://picsum.photos/id/40/400/250" alt="Image 4">

        </div>

    </div>


    <!-- ================= QUESTION 2 ================= -->

    <div class="question">

        <h2>Question 2 - Random Colors</h2>

        <span class="color-box">Span 1</span>

        <span class="color-box">Span 2</span>

        <span class="color-box">Span 3</span>

        <span class="color-box">Span 4</span>

        <br>

        <button id="changeColors">
            Change Color and Background colors
        </button>

    </div>


    <!-- ================= QUESTION 3 ================= -->

    <div class="question">

        <h2>Question 3 - Password Switch</h2>

        <div class="password-container">

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button id="switchPassword">
                Switch
            </button>

        </div>

    </div>


    <!-- ================= QUESTION 4 ================= -->

    <div class="question">

        <h2>Question 4 - Question Bank</h2>

        <div id="questionNumber"></div>

        <div id="questionText"></div>

        <div class="question-buttons">

            <button id="previous">
                Previous
            </button>

            <button id="next">
                Next
            </button>

        </div>

    </div>


    <!-- ================= QUESTION 5 ================= -->

    <div class="question">

        <h2>Question 5 - Simple Calculator</h2>

        <div class="calculator">

            <input
                type="text"
                id="display"
                readonly
            >

            <br>

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">←</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('*')">*</button>

            <br>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')">-</button>

            <br>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')">+</button>

            <br>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()">=</button>

            <br>

            <button onclick="appendValue('0')">0</button>

        </div>

    </div>


    <!-- ================= THANK YOU ================= -->

    <div class="question">

        <h2>Output</h2>

        <div id="thankYou"></div>

    </div>


    <script>


        // ================= QUESTION 2 =================

        let colors = [
            "red",
            "blue",
            "green",
            "orange",
            "purple",
            "pink",
            "yellow",
            "brown",
            "teal",
            "black"
        ];


        let spans =
            document.querySelectorAll(".color-box");


        document.getElementById("changeColors")
            .addEventListener("click", function () {

                spans.forEach(function (span) {

                    let colorIndex =
                        Math.floor(Math.random() * colors.length);

                    let backgroundIndex =
                        Math.floor(Math.random() * colors.length);

                    span.style.color =
                        colors[colorIndex];

                    span.style.backgroundColor =
                        colors[backgroundIndex];

                });

            });


        // ================= QUESTION 3 =================

        document.getElementById("switchPassword")
            .addEventListener("click", function () {

                let password =
                    document.getElementById("password");

                if (password.type === "password") {

                    password.type = "text";

                    this.innerHTML = "Hide";

                }
                else {

                    password.type = "password";

                    this.innerHTML = "Show";

                }

            });


        // ================= QUESTION 4 =================

        let questions = [

            "What is JavaScript?",

            "What is a variable in JavaScript?",

            "What is an array?",

            "What is a function?",

            "What is the DOM?",

            "What is an event in JavaScript?",

            "What is the difference between let and var?",

            "What is an object in JavaScript?",

            "What does JSON stand for?",

            "What is the purpose of console.log()?"

        ];


        let currentQuestion = 0;


        function displayQuestion() {

            document.getElementById("questionNumber")
                .innerHTML =
                "Question " +
                (currentQuestion + 1) +
                " of " +
                questions.length;

            document.getElementById("questionText")
                .innerHTML =
                questions[currentQuestion];

        }


        document.getElementById("next")
            .addEventListener("click", function () {

                if (currentQuestion < questions.length - 1) {

                    currentQuestion++;

                    displayQuestion();

                }

            });


        document.getElementById("previous")
            .addEventListener("click", function () {

                if (currentQuestion > 0) {

                    currentQuestion--;

                    displayQuestion();

                }

            });


        displayQuestion();


        // ================= THANK YOU =================

        document.getElementById("thankYou")
            .innerHTML = "Thank YOU";


    </script>


    <!-- External JavaScript file for Calculator -->

    <script src="calculator.js"></script>


</body>

</html>
