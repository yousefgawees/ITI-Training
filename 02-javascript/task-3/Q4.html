<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h2>Login Form</h2>

    <form action="welcome.html" method="get">

        <label>User Name:</label>
        <input
            type="text"
            name="username"
            value="Enter your user name here"
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
