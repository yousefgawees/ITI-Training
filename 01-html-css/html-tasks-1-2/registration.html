<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form - ITI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="roadmap.html">Road Map</a>
            <a href="registration.html">Registration Form</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="logo">
            <img src="images/ITI_logo.png" alt="ITI Logo">
        </div>

    </nav>


    <!-- Registration Section -->
    <div class="registration-container">

        <h1>Register - Create Account</h1>

        <p class="required-text">
            Fields marked with * are compulsory fields
        </p>


        <!-- Registration Form -->
        <form>


            <!-- Your Name -->
            <div class="form-row">
                <label for="name">
                    * Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>


            <!-- Email -->
            <div class="form-row">
                <label for="email">
                    * E-Mail ID
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>


            <!-- Alternate Email -->
            <div class="form-row">
                <label for="alternate-email">
                    Alternate E-Mail ID
                </label>

                <input
                    type="email"
                    id="alternate-email"
                    name="alternate-email"
                >
            </div>


            <!-- Phone -->
            <div class="form-row">
                <label for="phone">
                    Your Phone
                </label>

                <div class="phone-input">

                    <input
                        type="text"
                        placeholder="Country"
                    >

                    <input
                        type="text"
                        placeholder="Area"
                    >

                    <input
                        type="text"
                        placeholder="Phone Number"
                    >

                </div>
            </div>


            <!-- Mobile Phone -->
            <div class="form-row">
                <label for="mobile">
                    Mobile Phone
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                >
            </div>


            <!-- Postal Address -->
            <div class="form-row">
                <label for="address">
                    * Postal Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    required
                ></textarea>
            </div>


            <!-- Country -->
            <div class="form-row">
                <label for="country">
                    * Country
                </label>

                <select
                    id="country"
                    name="country"
                    required
                >

                    <option value="">
                        -- Select Country --
                    </option>

                    <option value="egypt">
                        Egypt
                    </option>

                    <option value="saudi-arabia">
                        Saudi Arabia
                    </option>

                    <option value="uae">
                        United Arab Emirates
                    </option>

                    <option value="usa">
                        USA
                    </option>

                    <option value="uk">
                        United Kingdom
                    </option>

                </select>
            </div>


            <!-- Password -->
            <div class="form-row">
                <label for="password">
                    * Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>


            <!-- Re-enter Password -->
            <div class="form-row">
                <label for="confirm-password">
                    * Re-Enter Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    required
                >
            </div>


            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >

                <label for="terms">
                    I accept the Terms of Use
                </label>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button type="submit">
                    Continue >>
                </button>

                <button type="reset">
                    Reset
                </button>

            </div>

        </form>

    </div>


    <!-- Footer -->
    <footer>

        <p>
            © Information Technology Institute (ITI)
        </p>

    </footer>

</body>

</html>
